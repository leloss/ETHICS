name: Quality Gates  
  
on:  
  push:  
    branches: [ main, master ]  
  pull_request:  
    branches: [ "**" ]  
  
permissions:  
  contents: read  
  
jobs:  
  checks:  
    runs-on: ubuntu-latest  
    concurrency:  
      group: quality-gates-${{ github.ref }}  
      cancel-in-progress: true  
    steps:  
      - name: Checkout  
        uses: actions/checkout@v4  
  
      - name: Set up Python  
        uses: actions/setup-python@v5  
        with:  
          python-version: "3.11"  
          cache: "pip"  
  
      - name: Install dependencies  
        run: |  
          python -m pip install --upgrade pip  
          pip install -r requirements.txt  
  
      - name: Run quality gates (performance, calibration, drift)  
        run: |  
          python scripts/run_quality_checks.py --config config/project.yaml  
        continue-on-error: false  
  
      - name: Run fairness checks  
        run: |  
          python scripts/run_fairness.py --fairness-config config/fairness_config.yaml --project-config config/project.yaml  
        continue-on-error: false  
  
      - name: Upload reports  
        if: always()  
        uses: actions/upload-artifact@v4  
        with:  
          name: rai-reports  
          path: |  
            reports/**  
            config/**  
