name: Quality Gates  
  
on:  
  push:  
    branches: [ main, master ]  
  pull_request:  
    branches: [ "**" ]  
  
permissions:  
  contents: read  
  
jobs:  
  checks:  
    runs-on: ubuntu-latest  
    concurrency:  
      group: quality-gates-${{ github.ref }}  
      cancel-in-progress: true  
    steps:  
      - name: Checkout  
        uses: actions/checkout@v4  
  
      - name: Set up Python  
        uses: actions/setup-python@v5  
        with:  
          python-version: "3.11"  
          cache: "pip"  
  
      - name: Install dependencies  
        run: |  
          python -m pip install --upgrade pip  
          pip install -r requirements.txt  
  
      # Gates fail on breached thresholds, not on absent data. A fresh clone has no
      # evaluation data, so these steps stand down until it is supplied.
      - name: Check for evaluation data  
        id: data  
        run: |  
          if [ -f data/processed/eval.csv ]; then  
            echo "present=true" >> "$GITHUB_OUTPUT"  
          else  
            echo "present=false" >> "$GITHUB_OUTPUT"  
            echo "::notice::No data/processed/eval.csv found. Performance, fairness, and accuracy gates are inactive until you add evaluation data."  
          fi  
  
      - name: Run quality gates (performance, calibration, drift)  
        if: steps.data.outputs.present == 'true'  
        run: |  
          python scripts/run_quality_checks.py --config config/project.yaml  
        continue-on-error: false  
  
      - name: Run fairness checks  
        if: steps.data.outputs.present == 'true'  
        run: |  
          python scripts/run_fairness.py --fairness-config config/fairness_config.yaml --project-config config/project.yaml  
        continue-on-error: false  
  
      - name: Run accuracy metrics  
        if: steps.data.outputs.present == 'true'  
        run: |  
          python scripts/run_accuracy_metrics.py --config config/accuracy_metrics.yaml  
        continue-on-error: false  
  
      # The X-Ray gates on governance evidence, not model output. Scored sheets live in  
      # models/<MODEL_ID>/ethics_xray.csv; the template stays blank. A partially scored  
      # sheet fails, so an unfilled assessment cannot pass as a zero-risk one.  
      - name: Score ETHICS System X-Ray  
        run: |  
          shopt -s nullglob  
          sheets=(models/*/ethics_xray.csv)  
          if [ ${#sheets[@]} -eq 0 ]; then  
            echo "No scored X-Ray sheets under models/*/ethics_xray.csv - skipping."  
            exit 0  
          fi  
          for sheet in "${sheets[@]}"; do  
            echo "== $sheet"  
            python scripts/run_ethics_xray.py --xray "$sheet" --out-dir "reports/$(basename $(dirname $sheet))"  
          done  
        continue-on-error: false  
  
      - name: Upload reports  
        if: always()  
        uses: actions/upload-artifact@v4  
        with:  
          name: rai-reports  
          path: |  
            reports/**  
            config/**  
